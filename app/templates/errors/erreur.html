{% extends "base.html" %}

{% block titre %}Erreur {{ code }}{% endblock %}

{% block contenu %}
<div class="text-center py-5">
    <p class="display-1 fw-bold text-primary mb-0">{{ code }}</p>
    <h1 class="h3 mb-3">{{ titre }}</h1>
    <p class="text-muted mb-4">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('main.accueil') }}">Retour à l'accueil</a>
</div>
{% endblock %}
